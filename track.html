<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabula Caloris Tracker</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{color-scheme:dark;--p:rgba(13,19,26,.95);--line:#344151;--text:#eef3f6;--muted:#9ca9b6;--gold:#f6bd4a}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font:14px/1.35 system-ui,sans-serif;background:#080c11;color:var(--text);overflow:hidden}.top,.list{position:fixed;z-index:5;background:var(--p);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px #0009}.top{left:12px;right:12px;top:12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}.brand{font-weight:800}.status{min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{grid-column:1/-1;height:5px;background:#26313d;border-radius:3px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b30,#ff9500,#f6bd4a)}button,select{height:32px;border:1px solid var(--line);border-radius:5px;background:#202b37;color:var(--text);padding:0 9px}.tools{display:flex;gap:7px;align-items:center}.list{left:12px;top:92px;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 112px);overflow:auto;padding:10px}.list[hidden]{display:none}.head{display:flex;gap:8px;align-items:center;margin-bottom:6px}.head b{flex:1}.row{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;color:var(--text);text-decoration:none;border-top:1px solid #29333e;padding:8px 4px;border-radius:4px}.row:hover{background:#1a2530}.swatch{width:10px;height:10px;border-radius:50%}.meta{min-width:0}.meta b,.meta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{color:var(--muted)}.frp{color:var(--gold);font:12px ui-monospace,monospace;white-space:nowrap}.hint{color:var(--muted);font-size:12px}@media(max-width:700px){.top{left:8px;right:8px;top:8px;grid-template-columns:1fr auto}.brand{grid-column:1}.status{grid-column:1/-1;grid-row:2}.tools{grid-column:2;grid-row:1}.list{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:42vh}.tools button{max-width:92px;overflow:hidden;text-overflow:ellipsis}}
.maplibregl-popup-content{color:#111}
</style></head><body>
<div id="map"></div><header class="top"><span class="brand">Tracker</span><span id="status" class="status">Loading live index…</span><span class="tools"><button id="notify">Notify</button><select id="window"><option value="active" selected>Active</option><option value="2h">2h</option></select><select id="sort"><option value="latest">Time</option><option value="frp">FRP</option><option value="count">Hotspots</option></select></span><div class="progress"><span id="bar"></span></div></header><aside id="list" class="list" hidden><div class="head"><b>Live clusters</b><span id="count" class="hint"></span></div><div id="rows" class="hint">Loading…</div></aside>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script><script>
const $=id=>document.getElementById(id),empty=()=>({type:'FeatureCollection',features:[]}),urlParams=new URLSearchParams(location.search),raw=decodeURIComponent(location.search.slice(1));let tracked=[],worker,seq=0,pending=new Map(),ready,events=[],latestSeen=0n,initial=true,refreshTimer,progressTimer;
const map=new maplibregl.Map({container:'map',center:[30,25],zoom:Math.max(1.6,Math.log2(innerWidth*360/(512*120))),projection:'globe',style:{version:8,sources:{base:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'base',type:'raster',source:'base',paint:{'raster-saturation':-.5,'raster-brightness-max':.7}}]}});map.addControl(new maplibregl.NavigationControl(),'bottom-right');
const pad=n=>String(n).padStart(2,'0'),local=t=>{const d=new Date(t*1000);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`},tixEpoch=v=>{const x=BigInt('0x'+v),l=Number(x>>42n),p=(x&((1n<<42n)-1n))>>BigInt(42-l);return Number((p<<BigInt(40-l))-549755813888n)},rankColor=i=>`hsl(${Math.round(i*137.508)%360} 78% 56%)`;
const validH3=x=>{try{return /^[0-9a-f]{15}$/.test(x)&&(h3.isValidCell?h3.isValidCell(x):(h3.getResolution(x)>=0))}catch{return false}},splitCells=text=>String(text||'').split(',').map(x=>x.trim().toLowerCase()).filter(validH3);
function parsePresetLine(rawLine){if(!rawLine.trim())return null;let parts=rawLine.split(';'),name,type,cells;if(parts.length>=3){name=parts.shift().trim();type=parts.shift().trim();cells=parts.join(';')}else{const head=parts.shift().split(':');name=head[0].trim();type=(head[1]||'').trim();cells=parts.join(';')}type=type==='inclusion'?'only':type==='exclusion'?'exclude':type;return name&&type?{name,type,cells:splitCells(cells)}:null}
async function presetCells(names){if(!names.length)return[];const wanted=new Set(names.map(x=>x.toLowerCase())),text=await(await fetch('filter_preset.csv',{cache:'no-store'})).text(),cells=[];for(const line of text.split(/\r?\n/)){const preset=parsePresetLine(line);if(preset&&wanted.has(preset.name.toLowerCase())&&preset.type==='only')cells.push(...preset.cells)}return cells}
async function resolveTracked(){const naked=raw&&!raw.includes('=')?raw:'',listed=splitCells([urlParams.get('cells'),urlParams.get('h3'),naked].filter(Boolean).join(',')),presets=String(urlParams.get('preset')||urlParams.get('presets')||'').split(',').map(x=>x.trim()).filter(Boolean),presetListed=await presetCells(presets);tracked=[...new Set([...listed,...presetListed])];return tracked}
function request(action,q={}){return ready.then(()=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});worker.postMessage({id,action,query:Object.fromEntries(q)})}))}
function startWorker(){if(worker)worker.terminate();worker=new Worker('compact_index_worker.js?v=7634d83');ready=new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});worker.postMessage({id,action:'init',query:{live:'ARCH/H3TI/LIVE.h3ti'}})});worker.onmessage=e=>{if(e.data.progress){$('status').textContent=`${e.data.progress.phase} · ${Math.round(e.data.progress.fraction*100)}%`;return}const p=pending.get(e.data.id);if(!p)return;pending.delete(e.data.id);e.data.error?p.reject(Error(e.data.error)):p.resolve(e.data.result)}}
function eventUrl(id){return 'event.html?'+new URLSearchParams({id,active:'1'})}
function draw(){const max=Math.max(1,...events.map(e=>e.hotspots)),features=events.map((e,i)=>{const c=h3.cellToLatLng(e.h7);return{id:i,type:'Feature',geometry:{type:'Point',coordinates:[c[1],c[0]]},properties:{id:e.id,color:rankColor(i),radius:Math.max(6,Math.min(22,5+Math.log1p(e.hotspots)/Math.log1p(max)*17)),label:`${local(tixEpoch(BigInt('0x'+e.last).toString(16)))} · ${e.hotspots.toLocaleString()} hotspots`}}});map.getSource('events').setData({type:'FeatureCollection',features});$('list').hidden=!events.length;$('count').textContent=events.length.toLocaleString();$('rows').innerHTML=events.length?events.map((e,i)=>`<a class="row" href="${eventUrl(e.id)}" data-feature="${i}"><span class="swatch" style="background:${rankColor(i)}"></span><span class="meta"><b>${local(tixEpoch(e.last))}</b><small>${e.hotspots.toLocaleString()} hotspots</small></span><span class="frp">${Math.round(e.frp).toLocaleString()} FRP</span></a>`).join(''):`No live clusters${$('window').value==='2h'?' in the last 2 hours':''}`;document.querySelectorAll('.row').forEach(row=>{const id=+row.dataset.feature;row.onmouseenter=()=>map.setFeatureState({source:'events',id},{hover:true});row.onmouseleave=()=>map.setFeatureState({source:'events',id},{hover:false})})}
async function load(){if(!tracked.length){$('status').textContent='No H3 cells selected';return}startWorker();try{const summary=await request('summary',new URLSearchParams({api:'summary',level:4,archive:0,only:tracked.join(',')})),latest=BigInt('0x'+summary.live_max),mode=$('window').value,q=new URLSearchParams({api:'top_events',limit:100,sort:$('sort').value,archive:0,only:tracked.join(',')});if(mode==='2h'){const from=latest-28800n,to=latest;q.set('from',from.toString(16));q.set('to',to.toString(16));q.set('last_only','1')}events=(await request('events',q)).events;$('status').textContent=`${mode==='2h'?'Last 2h':'Active live'} · latest ${local(tixEpoch(summary.live_max))} · ${tracked.length} H3 cells`;const newest=events.reduce((m,e)=>BigInt('0x'+e.last)>m?BigInt('0x'+e.last):m,0n);if(!initial&&newest>latestSeen&&'Notification'in window&&Notification.permission==='granted')new Notification('Tabula Caloris tracker',{body:`${events.length} live clusters in selected cells`});latestSeen=newest>latestSeen?newest:latestSeen;initial=false;draw()}catch(e){$('status').textContent=e.message}finally{scheduleRefresh()}}
function scheduleRefresh(){clearTimeout(refreshTimer);const now=Date.now(),next=Math.ceil(now/300000)*300000+2500;refreshTimer=setTimeout(load,Math.max(5000,next-now))}
function tick(){const now=Date.now(),phase=now%300000;$('bar').style.width=phase/300000*100+'%'}
$('sort').onchange=()=>{events.sort((a,b)=>$('sort').value==='frp'?b.frp-a.frp:$('sort').value==='count'?b.hotspots-a.hotspots:Number(BigInt('0x'+b.last)-BigInt('0x'+a.last)));draw()};$('window').onchange=load;$('notify').onclick=async()=>{if(!('Notification'in window))return $('notify').textContent='No notifications';const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'Notifying':'Notify'};
map.on('load',async()=>{map.addSource('events',{type:'geojson',data:empty()});map.addLayer({id:'events',type:'circle',source:'events',paint:{'circle-radius':['case',['boolean',['feature-state','hover'],false],['*',['get','radius'],1.8],['get','radius']],'circle-color':['get','color'],'circle-opacity':.9,'circle-stroke-color':'#fff','circle-stroke-width':['case',['boolean',['feature-state','hover'],false],3,1.2]}});map.on('click','events',e=>{location.href=eventUrl(e.features[0].properties.id)});map.on('mouseenter','events',e=>{map.getCanvas().style.cursor='pointer';new maplibregl.Popup({closeButton:false,closeOnClick:false}).setLngLat(e.lngLat).setText(e.features[0].properties.label).addTo(map)});map.on('mouseleave','events',()=>{map.getCanvas().style.cursor='';document.querySelectorAll('.maplibregl-popup').forEach(x=>x.remove())});try{await resolveTracked()}catch(e){$('status').textContent=e.message}if(tracked.length){const points=tracked.flatMap(c=>h3.cellToBoundary(c,true).map(p=>[p[0],p[1]])),bounds=points.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(points[0],points[0]));map.fitBounds(bounds,{padding:80,maxZoom:7,duration:0})}load()});progressTimer=setInterval(tick,1000);tick();
</script></body></html>
